<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ecommerce - Catálogo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Ecommerce</h1>
        <p>Catálogo de produtos em cards</p>
    </header>

    <section class="controls">
        <input id="search" type="text" placeholder="Buscar produto pelo nome...">
        <select id="category">
            <option value="Todas">Todas</option>
        </select>
        <button id="btnRender">Renderizar</button>
    </section>

    <main>
        <section id="product-list" class="product-list"></section>
    </main>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="product-details" class="product-details">
            <button id="closeModal" class="close-modal" aria-label="Fechar">&times;</button>
            <p class="empty">Clique em "Ver detalhes" em um produto para visualizar aqui.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
